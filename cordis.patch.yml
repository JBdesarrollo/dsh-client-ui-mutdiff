# Bundle patch for @jbdesarrollo/dsh-client-ui-mutdiff.
# Applied when the package is added to dsh.profile.bundles (e.g. via
# `dsh plugin --profile web add <pkg>`). It mounts this plugin as a client
# plugin entry so the browser is served /plugins/<id>/client.js, and loads
# lib/index.js in the host process, which registers the /mutdiff
# open-in-editor route.
#
# The open-in-editor behaviour is off by default and needs no configuration.
# For one run, name an environment variable on the invocation — no file is
# touched by anyone:
#
#   MUTDIFF=code dsh web        (VS Code, automatic mode on)
#   MUTDIFF=1 dsh web           (detected editor, automatic mode on)
#   MUTDIFF_EDITOR=zed dsh web  (a precise field, spelled out)
#   MUTDIFF_GOTO_LINE=0 dsh web
#
# This patch layer is only for a durable default, and it is your file to edit
# (the plugin reads config, it never writes it). Fields are overridden by entry
# id, after every bundle layer:
#
#   - id: client-ui-mutdiff
#     config:
#       autoOpen: true     # open every successful edit/write without a click
#       editor: code       # auto | code | windsurf | cursor | antigravity | zed | subl | <command>
#       gotoLine: true     # jump to the first changed line
#       roots: []          # extra directories an openable file may live under
#       openArgs: []       # e.g. ['--line', '{line}', '{file}']
#
- insert:
  - id: client-ui-mutdiff
    name: '@jbdesarrollo/dsh-client-ui-mutdiff'
